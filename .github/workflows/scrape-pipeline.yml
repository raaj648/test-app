name: ExpiredDomains Daemon Scraper Pipeline

on:
  schedule:
    # Run every 5 minutes (adjust according to your preferences)
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force_rotation:
        description: 'Force immediate session cookie rotation logic'
        required: false
        default: 'false'
        type: boolean

jobs:
  scrape_domains:
    name: Crawl and Query ExpiredDomains.net
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout Project Repository
        uses: actions/checkout@v4

      - name: Install Python 3.12 Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Scraper Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 seleniumbase supabase

      - name: Install Headless Chrome and Drivers
        run: |
          seleniumbase install chromedriver

      - name: Install Xvfb (X Virtual Framebuffer display server)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Execute Rotation-Aware Domain Harvest Pipeline (Headed Mode via Xvfb)
        run: |
          xvfb-run --server-args="-screen 0 1920x1080x24" python scraper/scraper.py

      - name: Upload Diagnostic Step-by-Step Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scraper-diagnostic-screenshots
          path: scraper/screenshots/
          if-no-files-found: warn

